<section class="cart">
    <h2 class="title">Carrito</h2>
    @if (carrito().length === 0) {
    <p class="empty">Tu carrito esta vacio.</p>
    } @else {
    <ul class="list">
        @for (producto of carrito(); track producto.id) {
        <li class="item">
            <span class="line">
                <img [src]="producto.URLImg" alt="{{ producto.nombre }}" class="imagen">
                <p class="informacion">{{ producto.nombre }} - {{ producto.precio | currency:'MXN' }}</p>
            </span>
            <button class="btn danger" (click)="quitar(producto.id)">Quitar</button>
        </li>
        }
    </ul>
    <div class="total">
        Total: {{ total() | currency:'MXN' }}
    </div>
    <div class="actions">
        <button class="btn" (click)="vaciar()">Vaciar Carrito</button>
        <button class="btn purple" (click)="checkout()">Pagar</button>
    </div>
    }
</section>
