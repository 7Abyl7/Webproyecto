<div class="contenedor-carrito">
    <h2 class="titulo-carrito">Carrito de compras</h2>
    @if (carrito().length === 0) {
    <div class="vacio">
        <p>Tu carrito está vacío.</p>
        <a routerLink="/">Ir al catálogo</a>
    </div> } @else {
    <ul class="list">
        @for (producto of carrito(); track producto.id) {
        <li class="item">
            <span class="line">
                <img [src]="producto.URLImg" alt="{{ producto.nombre }}" class="imagen">
                <p class="nombre">{{ producto.nombre }}</p>
                <p class="precio">{{ producto.precio | currency:'MXN' }}</p>
            </span>
            <button class="btn danger" (click)="quitar(producto.id)">Quitar</button>
        </li>
        }
    </ul>
    <p class="total">Total: {{ total() | currency:'MXN' }}</p>
    <div class="actions">
        <button class="btn" (click)="vaciar()">Vaciar Carrito</button>
        <button class="btn verde" (click)="checkout()">Ir a pago</button>
    </div>
    }
</div>
