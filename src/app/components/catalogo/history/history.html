<div class="contenedor">
    <h1>Historial de compras</h1>
    <div class="tabla">
        <div class="encabezado">
            <span>Miniatura</span>
            <span>Id de pedido</span>
            <span>Nombre</span>
            <span>Fecha compra</span>
            <span>Pago total</span>
        </div>
        @for(compra of historial; track compra.order_id) { @for (producto of compra.productos; track producto.id) {
        <div class="fila">
            <img [src]="producto.URLImg" alt="{{ producto.nombre }}">
            <span>{{ compra.order_id }}</span>
            <span>{{ producto.nombre }}</span>
            <span>{{ compra.fecha }}</span>
            <span>{{ producto.precio | currency:'MXN'}}</span>
        </div>
        } }
    </div>
</div>
